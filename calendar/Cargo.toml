[package]
name = "calendar"
edition = "2024"
keywords=["religious", "anglican", "calendar"]

[badges]

maintenance = { status = "experimental" }

[dependencies]
ansi_term = "0.12.1"
askama = "0.12.1"
calamine = { version ="0.25.0", features = ["chrono"]}
chrono = { version = "0.4.38", features = ["serde"] }
color-backtrace = "0.6.1"
convert_case = "0.6.0"
databake = { version = "0.1.8", features = ["derive"]}
delegate = "0.12.0"
enum-utils = "0.1.2"
getset = "0.1.2"
icalendar = "0.16.3"
itertools = "0.13.0"
json = "0.12.4"
lazy_static = "1.5.0"
log = "0.4.22"
num-traits = "0.2.19"
ron = "0.8.1"
rust_xlsxwriter = { version = "0.73.0", features = ["chrono"]}
serde = { version = "1.0.206", features = ["derive", "rc"] }
serde_derive = "1.0.206"
serde_json = "1.0.145"
simplelog = "0.12.2"
structopt = "0.3.26"
strum = { version = "0.26.3", features = ["derive"]}
strum_macros = "0.26.4"
url = "2.5.2"
